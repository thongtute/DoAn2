<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phòng trọ · TroPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="app-loading" data-page="phong" data-title="Phòng trọ" data-perm="phong.view">
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>
    <main class="app-content">
      <div class="page-head">
        <div>
          <h2>Sơ đồ phòng</h2>
          <p>Bấm vào một phòng để xem chi tiết, lập hợp đồng hoặc thu tiền.</p>
        </div>
        <div class="actions">
          <div class="btn-group" role="group" aria-label="Kiểu hiển thị">
            <button class="btn btn-outline-primary active" id="viewGrid" title="Dạng lưới"><i class="bi bi-grid-3x3-gap"></i></button>
            <button class="btn btn-outline-primary" id="viewTable" title="Dạng bảng"><i class="bi bi-list-ul"></i></button>
          </div>
          <button class="btn btn-primary" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Thêm phòng</button>
        </div>
      </div>

      <!-- Tab chọn khu trọ -->
      <ul class="nav nav-pills mb-3 gap-1" id="khuTabs"></ul>

      <!-- Bộ lọc -->
      <div class="card mb-3">
        <div class="card-body py-2 d-flex flex-wrap gap-2 justify-content-between align-items-center">
          <div class="filter-bar">
            <select class="form-select" id="fTang"></select>
            <select class="form-select" id="fTrangThai">
              <option value="">Tất cả trạng thái</option>
              <option value="trong">Trống</option>
              <option value="dangThue">Đang thuê</option>
              <option value="no">Nợ quá hạn</option>
              <option value="sapHetHan">Sắp/hết hạn HĐ</option>
              <option value="baoTri">Bảo trì</option>
            </select>
            <input type="search" class="form-control search" id="fSearch" placeholder="Tìm mã phòng, tên khách...">
          </div>
          <div class="legend" id="legend"></div>
        </div>
      </div>

      <!-- Dạng lưới: nhóm theo khu, rồi theo tầng -->
      <div id="gridView"></div>

      <!-- Dạng bảng (ẩn, bật bằng nút chuyển kiểu hiển thị) -->
      <div id="tableView" class="card table-card d-none">
        <div class="table-responsive">
          <table class="table table-hover" id="phongTable">
            <thead>
              <tr><th>Phòng</th><th>Khu</th><th>Tầng</th><th>Diện tích</th><th class="text-end">Giá thuê</th><th>Người đại diện</th><th>Trạng thái</th><th class="actions-col"></th></tr>
            </thead>
            <tbody id="phongRows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<!-- Modal thêm/sửa phòng -->
<div class="modal fade" id="phongModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <form class="modal-content" id="phongForm" novalidate>
      <div class="modal-header">
        <h5 class="modal-title">Thêm phòng</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="id">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Khu trọ *</label>
            <select class="form-select" name="khuId" required></select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Mã phòng *</label>
            <input class="form-control text-uppercase" name="maPhong" placeholder="VD: A105" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Tầng</label>
            <input type="number" class="form-control" name="tang" value="1" min="1">
          </div>
          <div class="col-md-4">
            <label class="form-label">Giá thuê (đ/tháng) *</label>
            <input type="number" class="form-control" name="giaThue" min="0" step="50000" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Diện tích (m²)</label>
            <input type="number" class="form-control" name="dienTich" min="0">
          </div>
          <div class="col-md-4">
            <label class="form-label">Số người tối đa</label>
            <input type="number" class="form-control" name="soNguoiToiDa" value="2" min="1">
          </div>
          <div class="col-md-6">
            <label class="form-label">Trạng thái</label>
            <select class="form-select" name="trangThai">
              <option value="trong">Trống – sẵn sàng cho thuê</option>
              <option value="baoTri">Bảo trì – tạm ngưng cho thuê</option>
              <option value="dangThue" disabled>Đang thuê – theo hợp đồng</option>
            </select>
            <div class="form-text" id="ttHint"></div>
          </div>
          <div class="col-12">
            <label class="form-label">Tiện nghi</label>
            <div class="check-group" id="tienNghiGroup"></div>
          </div>
          <div class="col-12">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" name="moTa" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
        <button type="submit" class="btn btn-primary">Lưu phòng</button>
      </div>
    </form>
  </div>
</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../config/app-config.js"></script>
<script src="../assets/js/core/utils.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/services/caiDat.js"></script>
<script src="../assets/js/services/khuTro.js"></script>
<script src="../assets/js/services/phong.js"></script>
<script src="../assets/js/services/khachThue.js"></script>
<script src="../assets/js/services/hopDong.js"></script>
<script src="../assets/js/services/chiSo.js"></script>
<script src="../assets/js/services/hoaDon.js"></script>
<script src="../assets/js/services/thanhToan.js"></script>
<script src="../assets/js/services/baoHong.js"></script>
<script src="../assets/js/services/baoCao.js"></script>
<script src="../assets/js/services/nguoiDung.js"></script>
<script src="../database/seed.js"></script>
<script src="../assets/js/core/auth.js"></script>
<script src="../assets/js/core/layout.js"></script>
<script src="../assets/js/core/boot.js"></script>
<script src="../assets/js/pages/phong.js"></script>
</body>
</html>
