<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khu trọ · TroPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="app-loading" data-page="khu-tro" data-title="Khu trọ" data-perm="khutro">
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"></aside>
  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>
    <main class="app-content">
      <div class="page-head">
        <div>
          <h2>Khu trọ</h2>
          <p>Mỗi khu trọ có giá điện, nước và các khoản dịch vụ riêng.</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Thêm khu trọ</button>
        </div>
      </div>

      <div class="row g-3" id="khuList"></div>
    </main>
  </div>
</div>
<!-- Modal thêm/sửa khu trọ -->
<div class="modal fade" id="khuModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" id="khuForm" novalidate>
      <div class="modal-header">
        <h5 class="modal-title">Thêm khu trọ</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="id">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Tên khu trọ *</label>
            <input class="form-control" name="ten" placeholder="VD: Khu A – Hòa Bình" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Địa chỉ</label>
            <input class="form-control" name="diaChi" placeholder="Số nhà, đường, phường, quận">
          </div>
          <div class="col-md-4">
            <label class="form-label">Giá điện (đ/kWh) *</label>
            <input type="number" class="form-control" name="giaDien" value="3500" min="0" step="100" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Cách tính nước</label>
            <select class="form-select" name="cachTinhNuoc">
              <option value="m3">Theo m³ (đồng hồ)</option>
              <option value="nguoi">Theo đầu người</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Giá nước *</label>
            <div class="input-group">
              <input type="number" class="form-control" name="giaNuoc" value="20000" min="0" step="1000" required>
              <span class="input-group-text" id="nuocUnit">đ/m³</span>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label d-flex justify-content-between align-items-center">
              <span>Dịch vụ cố định hằng tháng</span>
              <button type="button" class="btn btn-sm btn-link p-0" id="btnAddDv"><i class="bi bi-plus-circle me-1"></i>Thêm dịch vụ</button>
            </label>
            <div class="table-responsive border rounded">
              <table class="table table-sm mb-0">
                <thead><tr><th>Tên dịch vụ</th><th style="width:160px">Đơn giá (đ)</th><th style="width:150px">Tính theo</th><th style="width:40px"></th></tr></thead>
                <tbody id="dichVuRows"></tbody>
              </table>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" name="moTa" rows="2" placeholder="Ghi chú về khu trọ"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
        <button type="submit" class="btn btn-primary">Lưu khu trọ</button>
      </div>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../config/app-config.js"></script>
<script src="../assets/js/core/utils.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/services/caiDat.js"></script>
<script src="../assets/js/services/khuTro.js"></script>
<script src="../assets/js/services/phong.js"></script>
<script src="../assets/js/services/khachThue.js"></script>
<script src="../assets/js/services/hopDong.js"></script>
<script src="../assets/js/services/chiSo.js"></script>
<script src="../assets/js/services/hoaDon.js"></script>
<script src="../assets/js/services/thanhToan.js"></script>
<script src="../assets/js/services/baoHong.js"></script>
<script src="../assets/js/services/baoCao.js"></script>
<script src="../assets/js/services/nguoiDung.js"></script>
<script src="../database/seed.js"></script>
<script src="../assets/js/core/auth.js"></script>
<script src="../assets/js/core/layout.js"></script>
<script src="../assets/js/core/boot.js"></script>
<script src="../assets/js/pages/khu-tro.js"></script>
</body>
</html>
